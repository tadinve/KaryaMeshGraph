[project]
name = "karyameshgraph"
version = "0.1.0"
description = "KaryaMesh 'Remember' layer: provenance-backed business-rule knowledge graph built from KaryaMeshRAG SOP artifacts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    # Config files (config/source.yaml) are YAML per SPEC.md §4.
    "httpx>=0.28.1",
    "pyyaml>=6.0",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
karyameshgraph = "karyameshgraph.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/karyameshgraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
